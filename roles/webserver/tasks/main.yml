---
- name: Install Apache
  yum:
    name: httpd
    state: present
  notify: Restart Apache

- name: Start Apache
  service:
    name: httpd
    state: started
    enabled: yes

- name: Deploy custom homepage
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: apache
    mode: '0644'
  notify: Restart Apache
