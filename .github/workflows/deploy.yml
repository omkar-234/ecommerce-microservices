name: Deploy E-Commerce App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Fix PEM permissions
        run: chmod 400 $GITHUB_WORKSPACE/mumbaiPPK-key.pem

      - name: Run Ansible Playbook
        run: |
          cd $GITHUB_WORKSPACE
          ansible-playbook deploy.yml
